<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Your Appointment — INKVERSE</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/photos.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="/"><span class="mark"></span>INKVERSE</a>
    <nav class="links">
      <a href="/">Home</a>
      <a href="/gallery.html">Gallery</a>
      <a href="/custom.html">Custom Designer</a>
      <a class="active" href="/booking.html">Booking</a>
      <a href="/pricing.html">Pricing</a>
      <a href="/about.html">About</a>
      <a href="/reviews.html">Reviews</a>
      <a href="/contact.html">Contact</a>
    </nav>
    <a class="btn sm" href="/booking.html">Book Now</a>
  </header>
  <section class="wrap split">
    <div>
      <h1 class="page-title" style="text-align:left">BOOK YOUR APPOINTMENT</h1>
      <p class="sub">Follow these steps to book your session</p>
      <div class="steps">
        <div class="step on">1</div><div class="step">2</div><div class="step">3</div><div class="step">4</div>
        <div class="step">5</div><div class="step">6</div><div class="step">7</div><div class="step">8</div>
      </div>
      <div class="card pad">
        <h3>Personal Details</h3>
        <form onsubmit="event.preventDefault();location.href='/account.html'">
          <label>Full Name<input placeholder="Your name" /></label>
          <label>Email Address<input type="email" placeholder="you@email.com" /></label>
          <label>Phone Number<input placeholder="+91" /></label>
          <button class="btn" type="submit">Next →</button>
        </form>
      </div>
    </div>
    <div class="book-art ph-hero">
      <div class="cap"><b>Your Next Tattoo</b><div class="tiny">Starts Here</div></div>
    </div>
  </section>
</body>
</html>
